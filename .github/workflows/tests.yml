name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed statement data
        run: |
          # Raw statements, the ledger, the statement password and the generated
          # dashboard (which embeds every transaction) must never be committed.
          leaked=$(git ls-files | grep -Ei '\.pdf$|\.csv$|statement_password|statement_reconciliation\.json$|statement_import_log\.json$|merchant_categories\.json$|(^|/)index\.html$' || true)
          if [ -n "$leaked" ]; then
            echo "These files hold private statement data and must not be committed:"
            echo "$leaked"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python -m pytest -q
